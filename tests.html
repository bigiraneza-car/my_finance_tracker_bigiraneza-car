<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validator testing</title>
    <style>
        .pass {color:#013f2f; }
        .fail { color: darkred;}
    </style>
</head>
<body>
    <h1>Validator testing</h1>
    <p>To test if the validators put in place give what is expected. To be opened with live server</p>

    <!-- empty container for the test lines -->
    <div id="results">

    </div>
    <p role="status" id="summary"></p>
    <script type="module" >
        import {
            validateDescription,
            validateNoDuplicateWords,
            validateItem,
            validateAmount,
            validateDate,
            validateCategory,
        } from './scripts/validator.js';
        
        import {
            NO_DATA,
            totalSpent,
            topCategory,
            lastSevenDays,
            weeklySpent,
            capStatus,
        } from './scripts/stats.js';


        const results = document.getElementById('results');
        let passed =0;
        let total =0;
        // to display cleaner input
        const show = (text) =>
        JSON.stringify(text.length > 40 ? `${text.slice(0, 30)}... (${text.length} characters)` : text);
        // function used to test the validators
        function group(title, validate, cases) {
            const heading = document.createElement('h2');
            heading.textContent = title;
            const list = document.createElement('ul');
            for (const [input, expected] of cases) {
                const actual = validate(input).valid;
                const good = actual === expected;
                total++;
                if (good) passed++;
                const li =document.createElement('li');
                li.className = good ? 'pass' : 'fail';
                li.textContent =
                `${good ? 'PASS' : 'FAIL'}: ${show(input)} should be ${expected ? 'valid' : 'invalid'}` + (good ? '' : ` (got ${actual ? 'valid' : 'invalid'})`);
                list.appendChild(li);
            }
            results.append(heading, list);
        }
        // Example to test

        group('Description (basic rule)', validateDescription, [
                    ['Lunch at cafeteria', true],
                    [' Lunch', false],
                    ['A', true],
                    ['', false],
                    [' ', false],
                    ['bus pass 2', true],
        ]);

        // description advanced rule

        group('advanced rule description', validateNoDuplicateWords, [
            ['Lunch at cafeteria', true],
            ['the Lunch', true],
            ['', true],
            ['the the coffee', false], 
            ['The the bus', false],  //case-insensitive
            ['bus pass 2', true],
        ]);

        // description item rule: first check basic rule then advanced ones

        group('description both rule together', validateItem, [
            ['Lunch at cafeteria', true],
            [' Lunch', false],
            ['', false],
            ['the the coffee', false],
        ]);

        // amount validation
        group('amount', validateAmount, [
            ['0',true],
            ['4550',true],
            ['12.5',true],
            ['12.50', true],
            ['007',false],     //leading zeros, no trailing dot, no more than two decimals, no trailing space...
            ['-5',false],
            ['12.',false],   
            ['.12',false],
            [' 12',false],
            ['',false],
            ['12.56473',false],
        ]);

        //date validation
        group('date', validateDate, [
            ['2025-12-04', true],
            ['2023-10-24', true],
            ['2025-01-14', true],
            ['2025-13-04', false],  //month 13
            ['2022-00-40', false],  
            ['29-10-2024', false],  //wrong order
            ['2026-12-00', false],
        ]);

        //category validation
        group('category', validateCategory, [
            ['Food', true],
            ['Fees', true],
            ['Eating out', true],
            ['Food1', false],
            ['cold  Food', false],
            ['Food ', false],
            [' Food', false],
            ['', false],
        ]);
        
        //for comparing values (not valid/invalid) M5 stats tests
        const list = document.createElement('ul');
        const heading = document.createElement('h2');
        heading.textContent = 'stats';
        results.append(heading, list);

        function check(label, actual, expected) {
            const good = actual === expected;
            total++;
            if (good) passed++;
            const li = document.createElement('li');
            li.className = good ? 'pass' : 'fail';
            li.textContent = `${good ? 'PASS' : 'FAIL'}: ${label}` + (good ? '' : `(got ${actual}, expected ${expected})`);
            list.appendChild(li);
        }

        const rec = (amount, category, date) => ({amount, category, date });
        const today = new Date(2026, 9, 16);  //fixed date, so the tests never depend on the real date
        const week = lastSevenDays([
            rec(100, 'Food', '2026-10-16'),  //today: counted
            rec(200, 'Food', '2026-10-10'),  //6 days ago: counted
            rec(400, 'Food', '2026-10-09'),  //7 days ago: left out
            rec(800, 'Food', '2026-10-17'),  //future: left out
        ], today);

        check('empty list: total is 0', totalSpent([]), 0);
        check('empty list: top category', topCategory([]).name, NO_DATA);
        check('0.1 + 0.2 is exactly 0.3', totalSpent([rec(0.1, 'Food', 'x'), rec(0.2, 'Food', 'x')]), 0.3);
        check('top category is by money, not entries', topCategory([rec(10, 'Food', 'x'), rec(10, 'Food', 'x'), rec(100, 'Fees', 'x')]).name, 'Fees');
        check('last 7 days: 7 buckets', week.length, 7);
        check('last 7 days: the last bucket is today', week[6].key, '2026-10-16');
        check('last 7 days: ild and future records are left out', weeklySpent(week), 300);
        check('cap below spending is over', capStatus(1000, 1200).state, 'over');
        check('empty cap gives no message', capStatus(null, 100).state, 'none');


        //summary of the test

        const summary = document.getElementById('summary');
        summary.textContent = `${passed} of ${total} passed`;
        summary.className = passed === total ? 'pass' : 'fail';
    
    </script>
</body>
</html>
